<!DOCTYPE html>
<html>

<head>
    <title>AI DevOps Projects</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            background: url("/images/img1.jpg") no-repeat center/cover;
            color: grey;
            overflow-x: hidden;
        }

        /* Overlay */
        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.9));
            top: 0;
            left: 0;
        }

        /* Navbar */
        .navbar {
            position: relative;
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
        }

        .navbar h2 {
            color: #38bdf8;
        }

        .navbar button {
            margin-left: 10px;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #38bdf8;
        }

        /* Title */
        .container {
            position: relative;
            text-align: center;
            margin-top: 60px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        /* Robot animation */
        .robot {
            width: 120px;
            height: 120px;
            margin: 20px auto;
            border-radius: 50%;
            border: 5px solid #38bdf8;
            animation: spin 6s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Cards */
        .cards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            width: 220px;
            padding: 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card button {
            padding: 10px;
            background: #38bdf8;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Output */
        #output {
            margin-top: 40px;
            padding: 20px;
            width: 60%;
            margin-left: auto;
            margin-right: auto;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            min-height: 100px;
        }
    </style>
</head>

<body>

    <div class="overlay"></div>

    <!-- Navbar -->
    <div class="navbar">
        <h2>🤖 AI DevOps Control</h2>
        <div>
            <button onclick="goAbout()">About</button>
            <button onclick="goRegister()">Register</button>
            <button onclick="goLogin()">Login</button>
        </div>
    </div>

    <!-- Main -->
    <div class="container">

        <h1>Smart AI Monitoring System</h1>

        <!-- Robot Animation -->
        <div class="robot"></div>

        <div class="cards">

            <div class="card">
                <h3>🔍 Scan System</h3>
                <button onclick="runTask('Scanning system...')">Run</button>
            </div>

            <div class="card">
                <h3>☁️ Deploy AWS</h3>
                <button onclick="runTask('Deploying to AWS...')">Run</button>
            </div>

            <div class="card">
                <h3>📊 Analyze Logs</h3>
                <button onclick="runTask('Analyzing logs...')">Run</button>
            </div>

            <div class="card">
                <h3>⚙️ Auto Fix</h3>
                <button onclick="runTask('Auto-healing triggered...')">Run</button>
            </div>

        </div>

        <div id="output">🤖 AI system ready...</div>

    </div>

    <script>

        function runTask(msg) {
            const output = document.getElementById("output");
            output.innerText = msg;

            setTimeout(() => {
                output.innerText = "✅ Task completed successfully";
            }, 2000);
        }

        function goLogin() {
            window.location.href = "/login.html";
        }

        function goRegister() {
            window.location.href = "/register.html";
        }

        function goAbout() {
            window.location.href = "/about.html";
        }

    </script>

</body>

</html>
