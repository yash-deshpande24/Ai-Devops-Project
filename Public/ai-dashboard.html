<!DOCTYPE html>
<html>

<head>
    <title>AI Robot Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body {
            overflow: hidden;
            color: white;
        }

        /* 🤖 ROTATED ROBOT BACKGROUND */
        .robot-bg {
            position: fixed;
            top: 50%;
            left: 50%;

            width: 120%;
            height: 120%;

            background: url("/images/img7.jpg") repeat center/cover;
            background-size: cover;

            transform: translate(-50%, -50%) rotate(90deg);
            transform-origin: center;

            opacity: 0.25;
            z-index: -2;

            animation: slowRotate 40s linear infinite;
        }

        @keyframes slowRotate {
            from { transform: translate(-50%, -50%) rotate(90deg); }
            to { transform: translate(-50%, -50%) rotate(450deg); }
        }

        /* 🌑 Overlay */
        .overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: -1;
        }

        /* 📦 Main container */
        .container {
            position: relative;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 20px;
        }

        /* 🔄 AI Core */
        .ai-core {
            margin: 20px auto;
            width: 100px;
            height: 100px;
            border: 5px solid #38bdf8;
            border-radius: 50%;
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 🎛 Buttons */
        .buttons {
            margin-top: 30px;
        }

        .buttons button {
            margin: 10px;
            padding: 12px 20px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .buttons button:hover {
            background: #0ea5e9;
        }

        /* 📊 Output */
        #output {
            margin-top: 30px;
            padding: 20px;
            width: 60%;
            margin-left: auto;
            margin-right: auto;
            background: rgba(0,0,0,0.8);
            border-radius: 10px;
            min-height: 60px;
        }

        /* 🔙 Back button */
        .back-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #38bdf8;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

    </style>
</head>

<body>

    <!-- 🤖 Rotated Robot Background -->
    <div class="robot-bg"></div>

    <!-- 🌑 Overlay -->
    <div class="overlay"></div>

    <!-- 🎯 UI -->
    <div class="container">

        <h1>🤖 AI Robot Control Panel</h1>

        <div class="ai-core"></div>

        <div class="buttons">
            <button onclick="runTask('🔍 Scanning system...')">Scan System</button>
            <button onclick="runTask('☁️ Deploying on AWS...')">Deploy</button>
            <button onclick="runTask('📊 Analyzing logs...')">Analyze</button>
            <button onclick="runTask('⚙️ Auto-healing triggered...')">Auto Fix</button>
        </div>

        <div id="output">AI system ready...</div>

        <button class="back-btn" onclick="goDashboard()">⬅ Back</button>

    </div>

    <script>
        function runTask(message) {
            const output = document.getElementById("output");
            output.innerText = message;

            setTimeout(() => {
                output.innerText = "✅ Task Completed Successfully";
            }, 2000);
        }

        function goDashboard() {
            window.location.href = "/";
        }
    </script>

</body>

</html>
